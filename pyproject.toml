[project]
name = "hacs-airwatch"
version = "0.1.0"
description = "Home Assistant integration and Lovelace cards for provider-neutral flight tracking"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["frontend/dist", "frontend/node_modules"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["custom_components/airwatch"]
branch = true
